seed: 42
n_samples: 500

datasets:
  squad:
    name: "squad"
    split: "validation"
  nq:
    name: "nq_open"
    split: "validation"

models:
  weak:
    name: "google/flan-t5-base"
    max_new_tokens: 64
    batch_size: 16
  strong:
    name: "google/flan-t5-large"
    max_new_tokens: 64
    batch_size: 8

retrieval:
  method: "bm25"
  index_name: "wikipedia-dpr"
  top_k_large: 5
  top_k_small: 1
  eval_top_ks: [1, 3, 5, 10]

prompts:
  active_styles:
    - "basic"
    - "use_only_context"
    - "not_found_if_missing"
  default_style: "basic"

experiments:
  run_all_four_conditions: true
  conditions:
    - name: "weak_small"
      model_size: "weak"
      context_size: "small"
    - name: "weak_large"
      model_size: "weak"
      context_size: "large"
    - name: "strong_small"
      model_size: "strong"
      context_size: "small"
    - name: "strong_large"
      model_size: "strong"
      context_size: "large"

error_analysis:
  enabled: true

output_dir: "outputs/baseline"